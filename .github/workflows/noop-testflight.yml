name: Build NOOP TestFlight

# Monitor upstream on days 2-31. On the first day of each month,
# rebuild even if the app version has not changed (TestFlight builds expire).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 2-31 * *'
    - cron: '29 6 1 * *'

concurrency:
  group: noop-testflight
  cancel-in-progress: false

jobs:
  detect:
    name: Check latest upstream NOOP version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v5

      - name: Check version and last successful upload
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # Pin the upstream checkout to the commit inspected here.
          sha="$(gh api repos/ryanbr/noop/commits/main --jq '.sha')"
          project="$(curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/ryanbr/noop/${sha}/project.yml")"
          version="$(printf '%s\n' "$project" | sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*$/\1/p' | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Could not read MARKETING_VERSION from upstream project.yml'
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          marker="noop-testflight-v${version}"
          existing="$(git ls-remote --tags --refs origin "refs/tags/${marker}")"

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            reason='Manual run'
            should_build=true
          elif [[ "$SCHEDULE" == '29 6 1 * *' ]]; then
            reason='Monthly renewal'
            should_build=true
          elif [[ -z "$existing" ]]; then
            reason='Upstream version not yet uploaded by this automation'
            should_build=true
          else
            reason='Already uploaded this upstream version'
            should_build=false
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          {
            echo "### NOOP upstream: ${version}"
            echo "- Revision: ${sha}"
            echo "- Build required: **${should_build}** (${reason})"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and Upload NOOP
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write # Only to record a successfully uploaded version as a tag.

    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

    steps:
      - name: Checkout fork automation configuration
        uses: actions/checkout@v5
        with:
          path: automation
          persist-credentials: true

      - name: Checkout upstream NOOP source at verified revision
        uses: actions/checkout@v5
        with:
          repository: ryanbr/noop
          ref: ${{ needs.detect.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Verify credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in TEAMID GH_PAT MATCH_PASSWORD FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing secret: $key"
              exit 1
            fi
          done

      - name: Prepare Fastlane and export-compliance metadata
        shell: bash
        run: |
          set -euo pipefail
          cp automation/Gemfile source/Gemfile
          mkdir -p source/fastlane
          cp automation/fastlane/Fastfile source/fastlane/Fastfile

          # The owner confirmed NOOP uses no non-exempt encryption.
          # Add the matching declaration to the iOS app's generated Info.plist.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/project.yml')
          text = path.read_text()
          start = text.index('\n  NOOPiOS:\n')
          end = text.index('\n  NOOPiOSWidgets:\n', start)
          ios = text[start:end]
          if 'ITSAppUsesNonExemptEncryption:' not in ios:
              anchor = '        CFBundleDisplayName: NOOP\n'
              if anchor not in ios:
                  raise SystemExit('iOS Info.plist structure changed; review export compliance declaration')
              ios = ios.replace(anchor, anchor + '        ITSAppUsesNonExemptEncryption: false\n', 1)
              text = text[:start] + ios + text[end:]
              path.write_text(text)
          PY

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate signed Xcode project
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          printf 'BUNDLE_ID_PREFIX = com.andreaazzarello\nDEVELOPMENT_TEAM = %s\n' "$TEAMID" > Config/BundleIdSecrets.xcconfig
          xcodegen generate

      - name: Install Fastlane dependencies
        working-directory: source
        run: bundle install

      - name: Build and upload to TestFlight
        working-directory: source
        run: bundle exec fastlane ios noop_testflight

      - name: Record successful upstream version
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          tag="noop-testflight-v${UPSTREAM_VERSION}"
          existing="$(git -C automation ls-remote --tags --refs origin "refs/tags/${tag}")"
          if [[ -z "$existing" ]]; then
            git -C automation config user.name 'github-actions[bot]'
            git -C automation config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C automation tag "$tag"
            git -C automation push origin "refs/tags/${tag}"
          fi
          echo "Uploaded NOOP ${UPSTREAM_VERSION} to TestFlight." >> "$GITHUB_STEP_SUMMARY"
